<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Doko</title>
  <link rel="icon" href="/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="description" content="Doko — a chat app for your own AI models: on your iPhone, at home or in the cloud." />
  <style>
    :root { --bg:#0b0c12; --text:#fff; --muted:#9097a8; --accent:#9d9cff; --border:#22253a; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:32px; }
    .orb { width:96px; height:96px; border-radius:50%;
      background: radial-gradient(circle at 35% 30%, #fff 0%, #c9c8ff 18%, #7b7bf0 50%, #3b2f9e 100%);
      box-shadow: 0 0 60px rgba(157,156,255,.45); }
    .word { font-size:30px; font-weight:800; letter-spacing:6px; margin-top:22px; }
    .tag { color:var(--muted); font-size:16px; margin-top:14px; max-width:380px; line-height:1.5; }
    .links { margin-top:36px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
    .links a { color:var(--text); text-decoration:none; font-size:14px; font-weight:600; border:1px solid var(--border); border-radius:999px; padding:10px 20px; }
    .links a:hover { border-color:var(--accent); color:var(--accent); }
    footer { color:var(--muted); font-size:12px; margin-top:48px; }
    footer a { color:var(--muted); }
  </style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div>
  <div class="word">doko</div>
  <p class="tag">A chat app for your own AI models, wherever they run: on your iPhone, at home or in the cloud. Chat or call.</p>
  <nav class="links">
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Use</a>
    <a href="/support">Support</a>
  </nav>
  <footer>© 2026 Chaotic Neutral LLC · <a href="mailto:ethan@chaoticneutral.cafe">ethan@chaoticneutral.cafe</a></footer>
</body>
</html>
